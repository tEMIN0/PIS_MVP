{% extends "base.html" %}{% block title %}Материал{% endblock %}{% block content %}<div class="form-card wide"><h1>{% if material %}Редактирование материала{% else %}Новый материал{% endif %}</h1>
<form method="post"><label>Название<input name="title" maxlength="120" value="{{ material.title if material else '' }}" required></label><label>Описание<textarea name="description" rows="5" required>{{ material.description if material else '' }}</textarea></label><label>Категория<input name="category" value="{{ material.category if material else '' }}" placeholder="Например, Математика" required></label><label>Тип размещения<select name="mode" required>{% for mode in ['Обмен','Продажа','Бесплатно'] %}<option value="{{ mode }}" {% if material and material.mode==mode %}selected{% endif %}>{{ mode }}</option>{% endfor %}</select></label><label>Цена в рублях (для продажи)<input type="number" min="0" step="0.01" name="price" value="{{ material.price if material else '0' }}"></label><label>Ссылка на файл (необязательно)<input type="url" name="file_url" value="{{ material.file_url if material else '' }}" placeholder="https://..."></label><button>Сохранить</button></form></div>{% endblock %}
